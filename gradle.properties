# Project-wide Gradle settings.

# Maximum memory allocated to the Gradle JVM.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Compile Kotlin inside the Gradle process instead of using
# a separate Kotlin compiler daemon.
kotlin.compiler.execution.strategy=in-process

# Limit Gradle to one worker to reduce memory pressure.
org.gradle.workers.max=1

# AndroidX support.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Use non-transitive R classes to reduce resource processing.
android.nonTransitiveRClass=true
